<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Эссе — превью</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #1d1c1a; color: #e8e2d4; font: 14px/1.4 system-ui, sans-serif; }
      #stage { display: flex; justify-content: center; align-items: center; height: calc(100vh - 86px); }
      #stage canvas { height: 100% !important; width: auto !important; box-shadow: 0 6px 30px rgba(0,0,0,.5); }
      #bar { height: 86px; box-sizing: border-box; padding: 10px 16px; display: grid; gap: 8px; }
      #row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
      #scrub { width: 100%; }
      button, select { background: #2e2c29; color: inherit; border: 1px solid #4a4741; border-radius: 6px; padding: 4px 10px; font: inherit; }
      #time { font-variant-numeric: tabular-nums; opacity: .85; }
      body.render #bar { display: none; }
      body.render #stage { height: auto; display: block; }
      body.render #stage canvas { height: auto !important; width: auto !important; box-shadow: none; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="bar">
      <input id="scrub" type="range" min="0" max="0" value="0" step="1" />
      <div id="row">
        <button id="play">▶ Play</button>
        <select id="scene"></select>
        <label><input id="loop" type="checkbox" /> повтор сцены</label>
        <label><input id="sound" type="checkbox" checked /> звук</label>
        <span id="time"></span>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
